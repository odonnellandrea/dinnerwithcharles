[build]
command = "npm install && npm run build"
publish = "dist"

[dev]
command = "npm run dev"
port = 5173

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# pdfkit loads its built-in font data at runtime, so ship the package as is
[functions."reheat-pdf"]
external_node_modules = ["pdfkit"]

[functions."menu-pdf"]
external_node_modules = ["pdfkit"]

[functions."ops-pdf"]
external_node_modules = ["pdfkit"]
